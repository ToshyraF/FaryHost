name: faryhost_app
description: Pre-order and pickup app for flea/night market food stalls.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  # Experimental: powers MarketMapGameScreen only (see lib/features/customer/
  # market_game/). Never fetched/built here -- this sandbox has no network
  # access to pub.dev -- so this is genuinely unverified until CI (which has
  # both Flutter and network access) runs against it.
  flame: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  # Bundled so Thai text renders consistently across platforms and, more
  # importantly here, in golden tests (the flutter_tester test environment
  # has no real fonts unless the app explicitly ships one — see
  # test/flutter_test_config.dart). Loma is from the fonts-tlwg project;
  # see assets/fonts/LICENSE-Loma.txt.
  fonts:
    - family: Loma
      fonts:
        - asset: assets/fonts/Loma.otf
        - asset: assets/fonts/Loma-Bold.otf
          weight: 700
