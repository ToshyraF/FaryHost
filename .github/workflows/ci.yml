name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - name: gofmt check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt'ed:"
            echo "$unformatted"
            exit 1
          fi

      - name: go test
        run: go test ./...

  flutter:
    name: Flutter (app)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: flutter pub get
        run: flutter pub get

      # ยังไม่ได้รัน flutter analyze ในเครื่องนี้เลย (ไม่มี Flutter SDK) เผื่อมี
      # lint เล็กๆ น้อยๆ ที่ยังไม่รู้ ให้ analyze แจ้งเตือนแต่ไม่บล็อก CI ก่อน
      - name: flutter analyze
        run: flutter analyze
        continue-on-error: true

      # เทสนี้รวม golden test ด้วย — ครั้งแรกที่รัน "คาดว่าจะแดง" เพราะยังไม่มี
      # ไฟล์ภาพอ้างอิง (test/golden/goldens/*.png) ถูก commit ไว้เลย
      #
      # หมายเหตุ: flutter_test จะเขียนภาพ diff ลงโฟลเดอร์ failures/ ให้เอง
      # อัตโนมัติ "เฉพาะตอนที่มีไฟล์อ้างอิงอยู่แล้วแต่ภาพไม่ตรง" เท่านั้น —
      # ถ้าไฟล์อ้างอิงยังไม่มีอยู่เลย (กรณีนี้) มันจะแค่ throw error เฉยๆ
      # ไม่เขียนภาพอะไรออกมาให้ ต้องใช้ step ถัดไปที่รันด้วย --update-goldens
      # เพื่อบังคับให้ render ภาพออกมาเป็นไฟล์จริงสำหรับดูตรวจสอบ
      - name: flutter test
        run: flutter test

      - name: Render current golden images for review
        if: always()
        run: flutter test --update-goldens

      # อัปโหลดภาพที่ render ได้ (ทั้งกรณีเทสผ่านหรือไม่ผ่านก็ตาม) เป็น artifact
      # ให้ดาวน์โหลดมาดูก่อนตัดสินใจ copy เข้า test/golden/*/goldens/ แล้ว commit
      # เป็นไฟล์อ้างอิงจริง (สถานะ pass/fail ของ step "flutter test" ด้านบน
      # ยังคงเป็นตัวบอกผลจริงของ job นี้ ไม่ได้ถูกบดบังโดย step นี้)
      - name: Upload golden test renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-test-renders
          path: app/test/**/goldens/**
          if-no-files-found: ignore
