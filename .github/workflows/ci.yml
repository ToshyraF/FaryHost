name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - name: gofmt check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt'ed:"
            echo "$unformatted"
            exit 1
          fi

      - name: go test
        run: go test ./...

  flutter:
    name: Flutter (app)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: flutter pub get
        run: flutter pub get

      # ยังไม่ได้รัน flutter analyze ในเครื่องนี้เลย (ไม่มี Flutter SDK) เผื่อมี
      # lint เล็กๆ น้อยๆ ที่ยังไม่รู้ ให้ analyze แจ้งเตือนแต่ไม่บล็อก CI ก่อน
      - name: flutter analyze
        run: flutter analyze
        continue-on-error: true

      # เทสนี้รวม golden test ด้วย — ครั้งแรกที่รัน "คาดว่าจะแดง" เพราะยังไม่มี
      # ไฟล์ภาพอ้างอิง (test/golden/goldens/*.png) ถูก commit ไว้เลย
      # ดู step ถัดไปที่พ่นภาพที่ render จริงออกมาเป็น artifact ให้ตรวจสอบ
      - name: flutter test
        run: flutter test

      # flutter_test เขียนภาพที่ render จริง (และ diff ถ้ามีไฟล์อ้างอิงเดิมอยู่)
      # ลงโฟลเดอร์ failures/ ข้างๆ ไฟล์เทสโดยอัตโนมัติทุกครั้งที่ golden ไม่ตรง
      # หรือไฟล์อ้างอิงยังไม่มี — อัปโหลดโฟลเดอร์นั้นเป็น artifact ให้ดาวน์โหลด
      # มาตรวจก่อนตัดสินใจ commit เป็นภาพอ้างอิงจริง
      - name: Upload golden test failure images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-test-failures
          path: app/test/**/failures/**
          if-no-files-found: ignore
